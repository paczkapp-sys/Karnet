<style>

button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,li:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.go{width:100%;background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--accink);border:0;font-size:17px;font-weight:700;padding:16px;border-radius:16px;margin-top:14px;box-shadow:0 8px 20px rgba(91,91,240,.3)}

ul{list-style:none;margin:12px 0 0;padding:0}

.cl .i{flex:1;min-width:0}.cl b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,currentColor 14%,transparent)}
.bad{color:var(--warn)}.soon{color:var(--soon)}.ok{color:var(--ok)}

.hl{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;background:var(--card);border-radius:14px;margin-bottom:8px}

label{display:block;margin:14px 0 5px;font-size:13px;font-weight:600;color:var(--mute)}
input,textarea,select{width:100%;font:inherit;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.pr{display:flex;gap:10px;align-items:center;margin-top:8px}.pr input[type=number]{width:130px}
.ck{display:flex;gap:8px;align-items:center;flex:1;margin:0!important;color:var(--ink)!important;font-size:15px!important}.ck input{width:auto}
.row{display:flex;gap:8px;margin-top:10px}.row button{flex:1}
.ring{position:relative;width:220px;height:220px;margin:8px auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.big{font-size:68px;font-weight:800;line-height:1;letter-spacing:-.03em}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.meta div{background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--sh)}.meta b{display:block;font-size:17px}
.back{border:0;background:none;padding:0 0 12px;color:var(--acc)}
.hide{display:none}
#lock{position:fixed;inset:0;z-index:99;background:linear-gradient(160deg,var(--bg),color-mix(in srgb,var(--acc) 14%,var(--bg)));display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.lockicon{width:68px;height:68px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 10px 24px rgba(91,91,240,.35);margin-bottom:16px}
.lockicon svg{width:32px;height:32px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pe{min-height:24px;margin:0;color:var(--warn);font-weight:700;font-size:15px;text-align:center}
.shake{animation:sh .4s}
@keyframes sh{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
#lock.hide{display:none}
.dots{display:flex;gap:18px;margin:26px 0 10px}.dot{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--acc);transition:transform .12s,background .12s}.dot.f{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent;transform:scale(1.15)}
.pad{display:grid;grid-template-columns:repeat(3,80px);gap:16px;margin-top:14px}
.pad button{height:80px;border-radius:50%;font-size:30px;font-weight:700;background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:var(--sh);padding:0}
.pad button:active{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-color:transparent}
.pad button.sk{background:none;border:0;box-shadow:none;font-size:16px;color:var(--mute)}
.pad button.sk:active{background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--ink)}
@media (max-height:700px){.pad{grid-template-columns:repeat(3,68px);gap:12px}.pad button{height:68px;font-size:26px}.lockicon{display:none}.dots{margin:16px 0 6px}}
nav button{position:relative}
button,.cl{position:relative;overflow:hidden}
button:active{filter:brightness(.88)}
.cl:active{background:color-mix(in srgb,var(--acc) 16%,var(--card))}
.rp{position:absolute;border-radius:50%;background:currentColor;opacity:.2;transform:scale(0);animation:rp .55s ease-out;pointer-events:none}
@keyframes rp{to{transform:scale(2.6);opacity:0}}
.flash{animation:fl 1.2s ease-out}
@keyframes fl{0%{background:color-mix(in srgb,var(--ok) 32%,var(--card))}100%{background:var(--card)}}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#1F2340;color:#fff;padding:11px 18px;display:flex;align-items:center;gap:6px;border-radius:99px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:98;box-shadow:var(--sh);max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{background:none;border:0;color:#A5B4FC;font-weight:700;padding:8px 12px;min-height:36px;margin:-6px -10px -6px 4px;box-shadow:none}
html,body,button,.cl,input,select,textarea,summary{touch-action:manipulation}
button,.cl{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button{min-height:44px}
.hl button{padding:8px 14px;min-height:40px}

.back{min-height:44px;padding:10px 12px 14px 0}

.ck{min-height:44px}.ck input{width:22px;height:22px}

main{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}

ul p{grid-column:1/-1}
@media (min-width:700px){
main{max-width:640px;padding-top:34px}
main[data-v=list],main[data-v=plist],main[data-v=inact]{max-width:980px}
ul{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cl{margin-bottom:0;padding:14px}
h1{font-size:34px}
.ring{width:260px;height:260px}.big{font-size:80px}
nav button{max-width:200px;font-size:13px}nav svg{width:28px;height:28px}
}
@media (min-width:1000px){main[data-v=list],main[data-v=plist],main[data-v=inact]{max-width:1100px}ul{grid-template-columns:repeat(3,1fr)}}
@media (min-width:700px) and (min-height:760px){.pad{grid-template-columns:repeat(3,92px);gap:20px}.pad button{height:92px;font-size:34px}}
@media (hover:hover){.cl:hover{background:color-mix(in srgb,var(--acc) 7%,var(--card))}button:hover{filter:brightness(.96)}}
@supports not (background:color-mix(in srgb,red 10%,blue)){.tag{background:rgba(127,127,140,.18)}.plus{background:rgba(91,91,240,.12)}.note{background:rgba(217,129,0,.14)}nav{background:var(--card)}.cl:active{background:rgba(91,91,240,.16)}#lock{background:var(--bg)}@media (hover:hover){.cl:hover{background:rgba(91,91,240,.07)}}}
.bdg{position:absolute;top:0;left:calc(50% + 6px);background:var(--warn);color:#fff;font:700 10px/1 system-ui,sans-serif;font-style:normal;padding:3px 6px;border-radius:99px}
.note{background:color-mix(in srgb,var(--soon) 14%,transparent);border-left:4px solid var(--soon);border-radius:12px;padding:10px 14px;margin:0 0 14px;white-space:pre-wrap}
.note b{display:block;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--soon);margin-bottom:2px}
.pv{display:block;font-size:12px;color:var(--soon);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av.m{background:linear-gradient(135deg,#0EA5E9,#38BDF8)}.av.k{background:linear-gradient(135deg,#EC4899,#F472B6)}.av.d{background:linear-gradient(135deg,#F59E0B,#FBBF24)}
.seg{display:flex;gap:2px;background:var(--card);border-radius:16px;padding:4px;box-shadow:var(--sh);margin:0 0 12px}
.seg button{flex:1;border:0;background:none;box-shadow:none;border-radius:12px;padding:9px 4px;font-size:13px;color:var(--mute);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;box-shadow:0 4px 12px rgba(91,91,240,.3)}
.seg button[data-f=m]::before,.seg button[data-f=k]::before,.seg button[data-f=d]::before{content:"";width:8px;height:8px;border-radius:50%;flex:none}
.seg button[data-f=m]::before{background:#38BDF8}.seg button[data-f=k]::before{background:#F472B6}.seg button[data-f=d]::before{background:#FBBF24}

nav button{flex:1;max-width:150px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mute);padding:6px 4px}

<body><main id="app"></main><nav id="nav" class="hide"></nav><div id="lock"></div>
<script>
const K="karnety_v3";let S={clients:[]},view="list",cur=null,fm=null,q="";
const mig=cl=>cl.map(c=>c.passes?c:{id:c.id,name:c.name,passes:[{id:"p"+c.id,type:"multi",buy:c.buy,exp:c.exp,limit:c.limit,log:c.log||[]}]});
try{let r=localStorage.getItem(K);if(r)S=JSON.parse(r);else{r=localStorage.getItem("karnety_v2");if(r)S.clients=mig(JSON.parse(r).clients);else{const o=JSON.parse(localStorage.getItem("karnet_v1")||"null");if(o&&o.pass)S.clients=mig([{id:"c0",name:"Mój karnet",buy:o.pass.buy,exp:o.pass.exp,limit:o.pass.limit,log:o.log||[]}])}}}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fd=d=>new Date(d).toLocaleDateString("pl-PL");
const fdt=d=>new Date(d).toLocaleString("pl-PL",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
const today=()=>new Date().toISOString().slice(0,10);
const $=i=>document.getElementById(i);
const get=id=>S.clients.find(c=>c.id===id);
const cp=c=>c.passes[c.passes.length-1];
const PK={single:{n:"Jednorazowy",lim:1,price:30,label:"Jednorazowy – 30 zł"},p1:{n:"Pakiet 1",lim:4,price:120,label:"Pakiet 1 – 4 wejścia – 120 zł"},p2:{n:"Pakiet 2",lim:8,price:210,label:"Pakiet 2 – 8 wejść – 210 zł"},custom:{n:"Inny",label:"Inny (własny limit i cena)"}};
const tl=p=>p.type==="multi"?"Wielowejściowy":(PK[p.type]||PK.custom).n;
function info(c){const p=cp(c),left=Math.max(p.limit-p.log.length,0),days=p.exp?Math.ceil((new Date(p.exp+"T23:59:59")-new Date())/864e5):null;let st="ok",t="Aktywny";
  if(days!==null&&days<0){st="bad";t="Wygasł"}else if(left===0){st="bad";t=p.type==="single"?"Wykorzystany":"Brak wejść"}else if((days!==null&&days<=7)||(p.type!=="single"&&left<=2)){st="soon";t="Kończy się"}
  return{p,left,days,st,t}}
function rows(){
  const f=S.clients.filter(c=>c.name.toLowerCase().includes(q.toLowerCase())&&(cfilt==="all"||c.cat===cfilt)).sort((a,b)=>a.name.localeCompare(b.name,"pl"));
  return f.map(c=>{const i=info(c),p=i.p;const s=p.type==="single"?"Jednorazowy · kupiony "+fd(p.buy):i.left+"/"+p.limit+" wejść · do "+fd(p.exp);
    return `<li class="cl" tabindex="0" data-act="open" data-id="${c.id}"><span class="av ${c.cat||""}">${ini(c.name)}</span><div class="i"><b>${esc(c.name)}</b><span class="sub">${catL(c)?catL(c)+" · ":""}${s}</span>${c.notes?'<span class="pv">📝 '+esc(c.notes)+'</span>':""}</div><span class="tag ${i.st}">${i.t}</span><button class="plus" data-act="plus" data-id="${c.id}" aria-label="Dodaj wejście: ${esc(c.name)}">+1</button></li>`}).join("")||`<p class="sub">${S.clients.length?"Nie znaleziono klienta.":"Brak klientów. Dodaj pierwszego."}</p>`;
}
function pf(p){const t=p?(p.type==="multi"?"custom":p.type):"p1",s=t==="single",cu=t==="custom";
  return `<label for="tp">Rodzaj karnetu</label><select id="tp">${Object.entries(PK).map(([k,v])=>`<option value="${k}"${k===t?" selected":""}>${v.label}</option>`).join("")}</select>

function checkin(id){
  const c=get(id),i=info(c);
  if((i.left<=0||(i.days!==null&&i.days<0))&&!confirm(c.name+": "+(i.days!==null&&i.days<0?"karnet wygasł":"limit wejść wykorzystany")+". Zapisać mimo to?"))return;
  const ts=new Date().toISOString();i.p.log.push(ts);save();render();toast("Zapisano wejście: "+c.name,()=>{const k=i.p.log.lastIndexOf(ts);if(k>-1)i.p.log.splice(k,1);save();render()});const fe=document.querySelector('.cl[data-id="'+id+'"]');if(fe)fe.classList.add("flash");
}
function readPass(){
  const type=$("tp").value,buy=$("buy").value,pay=$("pay").value,err=$("err");
  if(!buy){err.textContent="Podaj datę zakupu.";return null}
  if(type==="single")return{type,buy,exp:"",limit:1,price:PK.single.price,pay};
  const exp=$("exp").value,k=PK[type],limit=k.lim||parseInt($("lim").value,10),price=k.price!=null?k.price:parseFloat($("prc").value);
  if(!exp||!limit||limit<1||!(price>=0)){err.textContent="Uzupełnij ważność, limit wejść i cenę.";return null}
  if(exp<buy){err.textContent="Data ważności jest przed datą zakupu.";return null}
  return{type,buy,exp,limit,price,pay};
}
const srt=c=>c.passes.sort((a,b)=>a.buy<b.buy?-1:a.buy>b.buy?1:0);
function syncRev(c,p){if(!(p.price>0))return;const F=S.fin=S.fin||[],d="Karnet: "+c.name+" – "+tl(p);const f=F.find(x=>x.pid===p.id);
  if(f){f.amt=p.price;f.date=p.buy;f.desc=d;f.pay=p.pay}else F.push({id:"f"+Date.now()+p.id,type:"in",amt:p.price,desc:d,date:p.buy,pid:p.id,pay:p.pay})}
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;const a=el.dataset.act,id=el.dataset.id;
  const gk=a+"|"+id+"|"+(el.dataset.i||"")+"|"+(el.dataset.f||"");if(gk===lastK&&Date.now()-lastT<450)return;lastK=gk;lastT=Date.now();
  if(a==="open"){cur=id;view="detail";render()}
  else if(a==="plus")checkin(id||cur);
  else if(a==="new"){cur=null;fm="client";view="form";render()}
  else if(a==="buy"){fm="buy";view="form";render()}
  else if(a==="rem"){view="rem";render()}
  else if(a==="rep"){view="rep";render()}
  else if(a==="tab1"){view="list";render()}
  else if(a==="inact"){view="inact";render()}
  else if(a==="chpin"){showLock("set",true)}
  else if(a==="tab2"){view="plist";render()}
  else if(a==="pfl"){pfilt=el.dataset.f;render()}
  else if(a==="cfl"){cfilt=el.dataset.f;render()}
  else if(a==="pcfl"){pcf=el.dataset.f;render()}
  else if(a==="pnew"){pmode="new";pcur=null;view="pform";render()}
  else if(a==="popen"){pcur=id;view="pdetail";render()}
  else if(a==="pback"){if(view==="pform"&&pcur){view="pdetail"}else{view="plist";pcur=null}render()}
  else if(a==="pedit"){pmode="edit";view="pform";render()}
  else if(a==="psave"){
    const name=$("pn").value.trim(),dieta=$("pdz").checked,pt=$("ppt").checked;
    if(!name){$("err").textContent="Podaj imię i nazwisko.";return}
    if(!dieta&&!pt){$("err").textContent="Wybierz co najmniej jedną usługę.";return}
    const d={name,dieta,pt,cat:$("pcat").value,dprice:parseFloat($("pdp").value)||0,pprice:parseFloat($("ppp").value)||0,goal:$("pg").value.trim(),notes:$("pnt").value.trim()};
    S.pc=S.pc||[];
    if(pmode==="edit"){Object.assign(pget(pcur),d);view="pdetail"}else{S.pc.push({id:"d"+Date.now(),...d,sessions:[]});view="plist"}
    toast("Zapisano klienta");save();render();
  }
  else if(a==="psess"){const c=pget(pcur),date=$("sd").value;if(!date){alert("Podaj datę.");return}
    const sid="s"+Date.now(),price=parseFloat($("sp").value),svc=$("sv").value;c.sessions.push({id:sid,date,svc,price:price>0?price:0,pay:$("spay").value,note:$("sn").value.trim()});if(price>0){c.lp=price;(S.fin=S.fin||[]).push({id:"f"+sid,type:"in",amt:price,desc:c.name+" – "+svc,date,pcid:c.id,sid,pay:$("spay").value})}c.sessions.sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:0);save();render();toast("Zapisano wpis")}
  else if(a==="pdelsess"){if(confirm("Usunąć tę sesję?")){const c=pget(pcur);c.sessions=c.sessions.filter(x=>x.id!==id);S.fin=(S.fin||[]).filter(f=>f.sid!==id);save();render()}}
  else if(a==="ppay"){const c=pget(pcur),amt=parseFloat($("pa").value);if(!(amt>0)){alert("Podaj kwotę większą od zera.");return}
    const d=$("pdsc").value.trim();(S.fin=S.fin||[]).push({id:"f"+Date.now(),type:"in",amt,desc:c.name+(d?" – "+d:""),date:today(),pcid:c.id});save();render()}
  else if(a==="pdelpay"){if(confirm("Usunąć tę płatność?")){S.fin=(S.fin||[]).filter(f=>f.id!==id);save();render()}}
  else if(a==="prm"){if(confirm("Usunąć klienta "+pget(pcur).name+" wraz z sesjami? Płatności zostaną w raporcie.")){S.pc=S.pc.filter(c=>c.id!==pcur);pcur=null;view="plist";save();render()}}
  else if(a==="addf"){
    const amt=parseFloat($("fa").value),date=$("fdate").value;
    if(!(amt>0)){$("err").textContent="Podaj kwotę większą od zera.";return}
    if(!date){$("err").textContent="Podaj datę.";return}
    (S.fin=S.fin||[]).push({id:"f"+Date.now(),type:$("ft").value,amt,desc:$("fdesc").value.trim(),date,pay:$("fpay").value});
    rmon=date.slice(0,7);save();render();toast("Dodano wpis do raportu");
  }
  else if(a==="delf"){if(confirm("Usunąć ten wpis?")){S.fin=(S.fin||[]).filter(f=>f.id!==id);save();render()}}
  else if(a==="cpm"){const t=$("msg");t.select();try{navigator.clipboard.writeText(t.value)}catch(x){}}
  else if(a==="edit"){fm="editpass";view="form";render()}
  else if(a==="back"){if(view==="form"&&cur){view="detail"}else{view="list";cur=null}render()}
  else if(a==="save"){
    const p=readPass();if(!p)return;
    if(fm==="buy"){const c=get(cur),np={id:"p"+Date.now(),...p,log:[]};c.passes.push(np);srt(c);syncRev(c,np);view="detail"}
    else{const name=$("nm").value.trim();if(!name){$("err").textContent="Podaj imię i nazwisko.";return}
      if(fm==="client"){const np={id:"p"+Date.now(),...p,log:[]},c={id:"c"+Date.now(),name,cat:$("ccat").value,notes:$("cn").value.trim(),passes:[np]};S.clients.push(c);syncRev(c,np);view="list"}
      else{const c=get(cur),q=cp(c);c.name=name;c.notes=$("cn").value.trim();c.cat=$("ccat").value;Object.assign(q,p);srt(c);syncRev(c,q);view="detail"}}

  else if(a==="delp"){const c=get(cur);if(c.passes.length<2){alert("Klient musi mieć co najmniej jeden karnet.");return}
    if(confirm("Usunąć ten karnet z historii zakupów wraz z jego wejściami?")){const rp=c.passes.splice(+el.dataset.i,1)[0];S.fin=(S.fin||[]).filter(f=>f.pid!==rp.id);save();render()}}
  else if(a==="rm"){if(confirm("Usunąć klienta "+get(cur).name+" wraz z historią?")){S.clients=S.clients.filter(c=>c.id!==cur);cur=null;view="list";save();render()}}
  else if(a==="cp"){const t=$("bk");t.select();try{navigator.clipboard.writeText(t.value)}catch(x){}toast("Skopiowano kopię zapasową")}
  else if(a==="imp"){try{const d=JSON.parse($("bk").value);if(Array.isArray(d.clients)){S={clients:mig(d.clients),fin:d.fin||[],pc:d.pc||[],rt:d.rt,rp:d.rp};save();render()}}catch(x){alert("Nieprawidłowa kopia.")}}
});

const PK2="karnety_pin";let pinBuf="",pinMode="unlock",pinFirst="",pinErr="",pinCancel=false,fails=0,lockedUntil=0,hidAt=0;
async function hp(salt,pin){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(salt+pin));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){let h=5381;const t=salt+pin;for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return "f"+h}}
function getPin(){try{return JSON.parse(localStorage.getItem(PK2)||"null")}catch(e){return null}}
function showLock(mode,cancel){pinMode=mode;pinBuf="";pinFirst="";pinErr="";pinCancel=!!cancel;drawLock();$("lock").classList.remove("hide")}
function drawLock(){
  const t={set:"Ustaw PIN",confirm:"Powtórz PIN",unlock:"Podaj PIN"}[pinMode],sub={set:"Wybierz 4 cyfry, które będą chronić aplikację",confirm:"Wpisz ten sam PIN jeszcze raz",unlock:"Odblokuj, aby zobaczyć klientów"}[pinMode];
  $("lock").innerHTML=`<div class="lockicon"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 018 0v3"/></svg></div><h1 style="justify-content:center;margin:0 0 6px;font-size:30px">${t}</h1><p class="sub" style="margin:0;font-size:15px;text-align:center">${sub}</p><div class="dots${pinErr?" shake":""}">${[0,1,2,3].map(i=>`<span class="dot${i<pinBuf.length?" f":""}"></span>`).join("")}</div><p class="pe">${pinErr||"&nbsp;"}</p><div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join("")}${pinCancel?'<button class="sk" data-k="x">Anuluj</button>':"<span></span>"}<button data-k="0">0</button><button class="sk" data-k="b" aria-label="Usuń cyfrę">⌫</button></div>`}
$("lock").addEventListener("click",async e=>{
  const b=e.target.closest("[data-k]");if(!b)return;const k=b.dataset.k;
  if(k==="x"){$("lock").classList.add("hide");return}
  if(Date.now()<lockedUntil){pinErr="Za dużo prób. Poczekaj chwilę.";drawLock();return}
  if(k==="b"){pinBuf=pinBuf.slice(0,-1);drawLock();return}
  if(pinBuf.length>=4)return;pinBuf+=k;pinErr="";drawLock();if(pinBuf.length<4)return;
  const pin=pinBuf;
  if(pinMode==="set"){pinFirst=pin;pinBuf="";pinMode="confirm";drawLock();return}
  if(pinMode==="confirm"){
    if(pin===pinFirst){const salt=Math.random().toString(36).slice(2),h=await hp(salt,pin);try{localStorage.setItem(PK2,JSON.stringify({s:salt,h}))}catch(x){}pinBuf="";$("lock").classList.add("hide");toast("PIN zapisany")}
    else{pinMode="set";pinBuf="";pinFirst="";pinErr="PIN-y nie pasują. Spróbuj ponownie.";drawLock()}
    return}
  const st=getPin(),h=await hp(st.s,pin);
  if(h===st.h){fails=0;pinBuf="";$("lock").classList.add("hide")}
  else{fails++;pinBuf="";if(fails>=5){lockedUntil=Date.now()+30000;fails=0;pinErr="Za dużo prób. Poczekaj 30 s."}else pinErr="Zły PIN";drawLock()}
});
